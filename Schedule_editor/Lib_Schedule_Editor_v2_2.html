<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8" />
    <title>Liburdi Schedule Editor</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        /* --- MODERN ENTERPRISE DARK THEME --- */
        :root {
            --bg-main: #141416;
            --bg-sidebar: #1b1b1f;
            --bg-panel: #202024;
            --bg-input: #18181c;
            --border-color: #2d2d34;
            --text-main: #f3f3f5;
            --text-muted: #8e8e93;
            --accent: #ff9800;
            --accent-hover: #e68900;
            --success: #4caf50;
            --danger: #ff5252;
            --danger-hover: #ff1744;
        }

        body {
            margin: 0;
            background: var(--bg-main);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* SIDEBAR */
        #sidebar {
            width: 300px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        #sidebar h2 {
            margin: 0;
            padding: 20px 18px 8px 18px;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        #fileList,
        #sidebarItems {
            padding: 0 8px;
        }

        .sidebar-item {
            padding: 10px 14px;
            margin: 2px 0;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13.5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s ease;
            color: #c5c5c9;
        }

        .sidebar-item:hover {
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
        }

        .sidebar-item.active {
            background: rgba(255, 152, 0, 0.1);
            color: var(--accent);
            font-weight: 600;
        }

        /* Tools Section Separation */
        .tools-section {
            margin-top: auto;
            border-top: 1px solid var(--border-color);
            padding-bottom: 15px;
        }

        .delete-file-btn {
            background: transparent;
            color: var(--text-muted);
            border: none;
            font-size: 18px;
            cursor: pointer;
            padding: 0 6px;
            line-height: 1;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .delete-file-btn:hover {
            background: rgba(255, 82, 82, 0.15);
            color: var(--danger);
        }

        /* MAIN LAYOUT */
        #main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-main);
        }

        #header {
            padding: 14px 24px;
            background: var(--bg-sidebar);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        #header strong {
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            margin-right: 10px;
        }

        .toolbar-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        /* FORM ELEMENTS */
        input[type="file"] {
            color: var(--text-muted);
            font-size: 13px;
        }

        input[type="file"]::-webkit-file-upload-button {
            background: #2a2a30;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-main);
            padding: 6px 12px;
            cursor: pointer;
            font-size: 12px;
            transition: background 0.2s;
        }

        input[type="file"]::-webkit-file-upload-button:hover {
            background: #35353c;
        }

        #searchBox {
            padding: 7px 14px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: var(--bg-input);
            color: #fff;
            min-width: 220px;
            max-width: 260px;
            font-size: 13px;
            transition: border-color 0.2s;
            margin-left: auto;
        }

        #searchBox:focus {
            outline: none;
            border-color: var(--accent);
        }

        /* BUTTONS */
        button,
        .btn-primary {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 7px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: background 0.2s;
        }

        button:hover:not(:disabled),
        .btn-primary:hover {
            background: var(--accent-hover);
        }

        button:disabled {
            background: #2a2a30;
            color: #555;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: transparent !important;
            color: var(--accent) !important;
            border: 1px solid rgba(255, 152, 0, 0.4) !important;
        }

        .btn-secondary:hover:not(:disabled) {
            background: rgba(255, 152, 0, 0.08) !important;
            border-color: var(--accent) !important;
        }

        #resetChangesBtn {
            background: transparent;
            color: var(--danger);
            border: 1px solid rgba(255, 82, 82, 0.3);
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        #resetChangesBtn:hover {
            background: rgba(255, 82, 82, 0.08);
            border-color: var(--danger);
        }

        /* CONTENT CONTAINER */
        #content {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
        }

        /* EDITABLE TITLE HEADER */
        .file-title-container {
            margin-bottom: 24px;
            background: var(--bg-panel);
            padding: 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .file-title-label {
            font-size: 10px;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 1px;
            font-weight: 700;
        }

        .file-title-input {
            background: transparent;
            border: 1px dashed #444;
            color: #fff;
            font-size: 22px;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 4px;
            width: 100%;
            box-sizing: border-box;
            transition: all 0.2s;
        }

        .file-title-input:focus {
            outline: none;
            border-color: var(--accent);
            border-style: solid;
            background: var(--bg-input);
        }

        /* PANELS & TABLES */
        .panel {
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            overflow: hidden;
        }

        .panel-header {
            padding: 14px 20px;
            background: #26262b;
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
            font-weight: 600;
            color: #fff;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        th {
            text-align: left;
            padding: 12px 20px;
            background: #1c1c21;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--border-color);
        }

        td {
            padding: 10px 20px;
            border-bottom: 1px solid #26262b;
            vertical-align: middle;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover {
            background: rgba(255, 255, 255, 0.01);
        }

        /* INPUTS IN TABLES */
        .input-container {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            max-width: 320px;
            /* Limits width to look clean on wide screens */
        }

        td input {
            flex: 1;
            box-sizing: border-box;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--accent);
            padding: 6px 10px;
            font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
            font-size: 13px;
            transition: all 0.15s;
        }

        td input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(255, 152, 0, 0.15);
        }

        td input.zero {
            color: #55555c !important;
        }

        /* TOGGLE BUTTONS */
        .unit-toggle-btn {
            background: #2a2a30;
            color: #a0a0a5;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            min-width: 70px;
            text-align: center;
            transition: all 0.15s ease;
        }

        .unit-toggle-btn:hover {
            background: #35353c;
            color: #fff;
        }

        .unit-toggle-btn.mode-in {
            color: #2196f3;
            background: rgba(33, 150, 243, 0.08);
            border-color: rgba(33, 150, 243, 0.3);
        }

        .unit-toggle-btn.mode-mm {
            color: #4caf50;
            background: rgba(76, 175, 80, 0.08);
            border-color: rgba(76, 175, 80, 0.3);
        }

        .unit-toggle-btn.mode-cmmin {
            color: #00bcd4;
            background: rgba(0, 188, 212, 0.08);
            border-color: rgba(0, 188, 212, 0.3);
        }

        .unit-toggle-btn.mode-static {
            color: #b388ff;
            background: rgba(179, 136, 255, 0.08);
            border-color: rgba(179, 136, 255, 0.3);
        }

        /* PARAMETER STATES */
        .important-name {
            color: var(--accent);
            font-weight: 600;
        }

        .important-cell {
            background: rgba(255, 152, 0, 0.02) !important;
        }

        .important-cell input {
            border-color: rgba(255, 152, 0, 0.25);
        }

        .changed {
            background: rgba(76, 175, 80, 0.06) !important;
            border-color: var(--success) !important;
            color: #fff !important;
        }

        /* BADGES */
        .badge {
            background: #2a2a30;
            color: var(--accent);
            border: 1px solid rgba(255, 152, 0, 0.3);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        /* CONVERTER TOOL */
        .converter-group {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }

        .converter-field {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .converter-field label {
            font-size: 12px;
            color: var(--text-muted);
        }

        .converter-field input {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: #fff;
            padding: 10px;
            font-size: 14px;
        }

        /* MODAL DIALOG */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            visibility: hidden;
            opacity: 0;
            transition: all 0.2s ease;
        }

        .modal-overlay.show {
            visibility: visible;
            opacity: 1;
        }

        .modal-box {
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 24px;
            width: 420px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .modal-box h3 {
            margin-top: 0;
            color: #fff;
            font-size: 18px;
            font-weight: 600;
        }

        .modal-box input[type="text"] {
            width: 100%;
            box-sizing: border-box;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: #fff;
            padding: 10px;
            font-size: 14px;
            margin: 16px 0;
        }

        .modal-box input[type="text"]:focus {
            outline: none;
            border-color: var(--accent);
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .return-btn,
        .batch-save-btn {
            padding: 7px 14px;
            border-radius: 50%;
            width: 38px;
            height: 38px;
            min-width: 38px;
            border: 1px solid rgba(255, 152, 0, 0.45);
            background: transparent;
            color: var(--accent);
            cursor: pointer;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            line-height: 1;
        }

        .return-btn:disabled,
        .batch-save-btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .diff-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 18px;
        }

        .diff-table th,
        .diff-table td {
            border: 1px solid var(--border-color);
            padding: 8px 10px;
            text-align: left;
            vertical-align: top;
            font-size: 12px;
        }

        .diff-table th {
            background: rgba(255, 152, 0, 0.08);
            color: #fff;
        }

        .diff-status {
            font-weight: 700;
            color: var(--danger);
        }

        .diff-status.same {
            color: var(--success);
        }

        /* FOOTER */
        .footer {
            padding: 12px 24px;
            background: var(--bg-sidebar);
            border-top: 1px solid var(--border-color);
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
        }

        .footer b {
            color: #fff;
        }
    </style>
</head>

<body>

    <div id="sidebar">
        <h2>Files</h2>
        <div id="fileList"></div>

        <h2>Sections</h2>
        <div id="sidebarItems"></div>

        <div class="tools-section">
            <h2>Tools</h2>
            <div class="sidebar-item" id="compareBtn">Comparison</div>
            <div class="sidebar-item" id="converterBtn">Unit Converter</div>
            <div class="sidebar-item" id="hiddenManagerBtn">Hidden Parameters</div>
            <div class="sidebar-item" id="changeLogBtn">Change Log</div>
        </div>
    </div>

    <div id="main">
        <div id="header">
            <strong>Liburdi Schedule Editor</strong>
            <div class="header-actions">
                <button id="returnBtn" class="return-btn" type="button" disabled title="Undo last change">↩</button>
                <button id="redoBtn" class="return-btn" type="button" disabled
                    title="Redo last undone change">↪</button>
                <input type="file" id="fileInput" accept=".xml" multiple />
                <button id="selectAllBtn">Alle auswählen</button>
                <button id="clearSelectionBtn" class="btn-secondary">Auswahl löschen</button>
                <input id="searchBox" type="text" placeholder="Search parameter or value...">
                <span class="badge" id="changeCounter">0 Changes</span>
                <button id="saveBtn" disabled>Save</button>
                <button id="saveAsBtn" class="btn-secondary" disabled>Save As...</button>
                <button id="batchSaveBtn" class="batch-save-btn" type="button" disabled>Batch Save</button>
            </div>
        </div>

        <div id="content">
            <div id="noFileMessage" style="text-align: center; margin-top: 80px; color: var(--text-muted);">
                <h3 style="color: #fff;">No file loaded</h3>
                <p>Please select one or more Liburdi XML schedule files above to begin.</p>
            </div>
        </div>

        <div class="footer">
            <span id="status">Ready.</span>
            <span>Created by <b>David Blank, Bilfinger</b></span>
        </div>
    </div>

    <div class="modal-overlay" id="saveAsModal">
        <div class="modal-box">
            <h3>Save File As</h3>
            <label for="customFileName" style="font-size: 12px; color: var(--text-muted);">Enter file name:</label>
            <input type="text" id="customFileName" placeholder="filename.xml">
            <div class="modal-actions">
                <button id="modalCancelBtn" class="btn-secondary"
                    style="padding: 7px 16px; font-size: 13px; border-radius: 6px; cursor: pointer;">Cancel</button>
                <button id="modalConfirmBtn" class="btn-primary">Download</button>
            </div>
        </div>
    </div>

    <script>
        /* STATE */
        let loadedFiles = [];
        let selectedFiles = new Set();
        let activeFile = -1;
        let lastSelectedSection = "segments";
        let hiddenFields = new Set(JSON.parse(localStorage.getItem("hiddenFields") || "[]"));
        let changeLog = JSON.parse(localStorage.getItem("scheduleEditorChangeLog") || "[]");
        let undoStack = [];
        let redoStack = [];
        let pendingEdit = null;

        let parameterUnits = JSON.parse(localStorage.getItem("parameterUnits") || "{}");

        let defaultImportant = [
            "pri_amp", "bkg_amp",
            "pri_travel", "bkg_travel",
            "pulse_freq", "pulse_width",
            "pri_wire", "bkg_wire"
        ];
        let importantFields = new Set(JSON.parse(localStorage.getItem("importantFields") || JSON.stringify(defaultImportant)));

        const MODES_ORDER = ['none', 'in', 'mm', 'cmmin', 'ampere', 'volt', 'seconds', 'degree'];

        /* HELPERS */
        function saveHidden() { localStorage.setItem("hiddenFields", JSON.stringify([...hiddenFields])); }
        function saveImportant() { localStorage.setItem("importantFields", JSON.stringify([...importantFields])); }
        function saveParameterUnits() { localStorage.setItem("parameterUnits", JSON.stringify(parameterUnits)); }
        function saveChangeLog() { localStorage.setItem("scheduleEditorChangeLog", JSON.stringify(changeLog.slice(0, 200))); }

        function updateUndoRedoButtons() {
            const undoBtn = document.getElementById("returnBtn");
            const redoBtn = document.getElementById("redoBtn");
            if (undoBtn) undoBtn.disabled = undoStack.length === 0;
            if (redoBtn) redoBtn.disabled = redoStack.length === 0;
        }

        function setPendingEdit(edit) {
            pendingEdit = edit;
        }

        function commitPendingEdit() {
            if (!pendingEdit) return;
            const action = pendingEdit;
            if (!action || !action.changes || !action.changes.length) {
                pendingEdit = null;
                return;
            }
            const hasEffectiveChange = action.changes.some(change => change.oldValue !== change.newValue);
            if (hasEffectiveChange) {
                undoStack.push(action);
                if (undoStack.length > 200) undoStack.shift();
                redoStack = [];
                updateUndoRedoButtons();
            }
            pendingEdit = null;
        }

        function applyChangeAction(action, reverse = false) {
            if (!action || !action.changes) return;
            action.changes.forEach(change => {
                const file = loadedFiles[change.fileIndex];
                if (!file) return;
                const sectionName = change.sectionName;
                let targetNode = null;
                if (sectionName === "segments") {
                    targetNode = file.sections.segments.find(seg => seg.getAttribute("index") === change.segmentIndex);
                    if (targetNode) targetNode = targetNode.querySelector(change.key);
                } else if (file.sections[sectionName]) {
                    targetNode = file.sections[sectionName].querySelector(change.key);
                }
                if (!targetNode) return;
                const targetValue = reverse ? change.oldValue : change.newValue;
                targetNode.textContent = targetValue;
                updateChangeLogEntry({
                    fileIndex: change.fileIndex,
                    fileName: loadedFiles[change.fileIndex]?.name || change.fileName || "unknown",
                    sectionName,
                    key: change.key,
                    segmentIndex: change.segmentIndex,
                    oldValue: change.oldValue,
                    newValue: targetValue
                });
            });
            if (activeFile >= 0 && activeFile < loadedFiles.length) {
                const sectionName = lastSelectedSection;
                if (sectionName === action.changes[0]?.sectionName) {
                    showSection(sectionName);
                }
            }
            saveChangeLog();
            updateChangeCounter();
        }

        function undoLastEdit() {
            commitPendingEdit();
            if (!undoStack.length) return;
            const action = undoStack.pop();
            applyChangeAction(action, true);
            redoStack.push(action);
            updateUndoRedoButtons();
        }

        function redoLastEdit() {
            if (!redoStack.length) return;
            const action = redoStack.pop();
            applyChangeAction(action, false);
            undoStack.push(action);
            updateUndoRedoButtons();
        }

        function findChangeLogIndex({ fileIndex, sectionName, key, segmentIndex }) {
            return changeLog.findIndex(entry => {
                const sameIndex = entry.fileIndex === fileIndex || (!isFinite(entry.fileIndex) && entry.fileName === loadedFiles[fileIndex]?.name);
                const sameSection = entry.section === sectionName;
                const sameKey = entry.key === key;
                const sameSegment = (entry.segmentIndex || "") === (segmentIndex || "");
                return sameIndex && sameSection && sameKey && sameSegment;
            });
        }

        function updateChangeLogEntry({ fileIndex, fileName, sectionName, key, segmentIndex, oldValue, newValue }) {
            const idx = findChangeLogIndex({ fileIndex, sectionName, key, segmentIndex });
            const entry = {
                id: `${Date.now()}-${Math.random().toString(16).slice(2)}`,
                timestamp: new Date().toISOString(),
                fileIndex,
                fileName,
                section: sectionName || "unknown",
                key,
                segmentIndex: segmentIndex || "",
                oldValue: String(oldValue ?? ""),
                newValue: String(newValue ?? "")
            };
            if (entry.newValue === entry.oldValue) {
                if (idx >= 0) {
                    changeLog.splice(idx, 1);
                }
            } else if (idx >= 0) {
                entry.id = changeLog[idx].id;
                entry.timestamp = changeLog[idx].timestamp;
                changeLog[idx] = entry;
            } else {
                changeLog.unshift(entry);
            }
            changeLog = changeLog.slice(0, 200);
            saveChangeLog();
            updateChangeCounter();
        }

        function renderChangeLog() {
            const content = document.getElementById("content");
            content.innerHTML = "<h2>Change Log</h2>";

            if (!changeLog.length) {
                const empty = document.createElement("p");
                empty.style.color = "var(--text-muted)";
                empty.textContent = "No changes recorded yet.";
                content.appendChild(empty);
                return;
            }

            const table = document.createElement("table");
            table.className = "diff-table";
            table.innerHTML = "<tr><th>Time</th><th>File</th><th>Section</th><th>Parameter</th><th>Old</th><th>New</th></tr>";

            changeLog.forEach(entry => {
                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td>${new Date(entry.timestamp).toLocaleString()}</td>
                    <td>${entry.fileName}</td>
                    <td>${entry.section}</td>
                    <td>${entry.key}</td>
                    <td>${entry.oldValue || "-"}</td>
                    <td>${entry.newValue || "-"}</td>
                `;
                table.appendChild(tr);
            });

            content.appendChild(table);
        }

        function styleInput(input) {
            const pureVal = input.value.replace(/\s*(in|mm|cm\/min|A|V|s|°)$/i, "").trim();
            if (pureVal === "0") input.classList.add("zero");
            else input.classList.remove("zero");
        }

        function getDecimalPlaces(value) {
            const match = ('' + value).match(/(?:\.(\d+))?(?:[eE]([+-]?\d+))?$/);
            if (!match) { return 0; }
            return Math.max(0, (match[1] ? match[1].length : 0) - (match[2] ? +match[2] : 0));
        }

        function toggleImportant(key, refreshCallback) {
            if (importantFields.has(key)) importantFields.delete(key);
            else importantFields.add(key);
            saveImportant();
            refreshCallback();
        }

        function sortParams(a, b) {
            const aImp = importantFields.has(a); const bImp = importantFields.has(b);
            const aHid = hiddenFields.has(a); const bHid = hiddenFields.has(b);
            if (aImp && !bImp) return -1; if (!aImp && bImp) return 1;
            if (!aHid && bHid) return -1; if (aHid && !bHid) return 1;
            return a.localeCompare(b);
        }

        /* FILE LOADING */
        document.getElementById("fileInput").addEventListener("change", e => {
            const files = e.target.files;
            if (!files || files.length === 0) return;

            let loadedCounter = 0;
            const targetCount = files.length;
            const currentSelectionStart = loadedFiles.length;

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                const reader = new FileReader();

                reader.onload = () => {
                    const xml = new DOMParser().parseFromString(reader.result, "application/xml");
                    loadedFiles.push({
                        name: file.name,
                        xml,
                        originalXml: xml.cloneNode(true),
                        sections: {
                            global: xml.querySelector("global"),
                            limits: xml.querySelector("limits"),
                            overrides: xml.querySelector("overrides"),
                            segments: [...xml.querySelectorAll("segment")]
                        }
                    });
                    selectedFiles.add(currentSelectionStart + loadedCounter);
                    loadedCounter++;
                    if (loadedCounter === targetCount) {
                        activeFile = currentSelectionStart;
                        updateUI();
                        document.getElementById("status").textContent = `${targetCount} file(s) loaded successfully.`;
                        e.target.value = "";
                    }
                };
                reader.readAsText(file);
            }
        });

        function updateUI() {
            const batchSaveBtn = document.getElementById("batchSaveBtn");
            const resetBtn = document.getElementById("resetChangesBtn");
            if (loadedFiles.length > 0) {
                if (activeFile < 0 || activeFile >= loadedFiles.length) activeFile = 0;
                renderFileList();
                renderSidebar();
                showSection(lastSelectedSection);
                document.getElementById("saveBtn").disabled = false;
                document.getElementById("saveAsBtn").disabled = false;
                batchSaveBtn.disabled = false;
                if (resetBtn) resetBtn.disabled = false;
                updateUndoRedoButtons();
            } else {
                activeFile = -1;
                document.getElementById("fileList").innerHTML = "";
                document.getElementById("sidebarItems").innerHTML = "";
                document.getElementById("saveBtn").disabled = true;
                document.getElementById("saveAsBtn").disabled = true;
                batchSaveBtn.disabled = true;
                if (resetBtn) resetBtn.disabled = true;
                updateUndoRedoButtons();
                resetContentToPlaceholder();
            }
            updateSelectionStatus();
        }

        function normalizeSelectionIndexes() {
            const nextSelection = new Set();
            loadedFiles.forEach((_, index) => {

        function removeFile(index) {

            normalizeSelectionIndexes();

        function injectFileTitleHeader(container) {

        function showSection(name) {

        /* DYNAMIC INTERACTIVE INPUT FIELD */
        function createInputField(child, key, sectionName = lastSelectedSection, segmentIndex = "") {
            const container = document.createElement("div");
            container.className = "input-container";

            const input = document.createElement("input");
            input.dataset.fieldName = key;
            input.dataset.sectionName = sectionName;
            input.dataset.fileName = loadedFiles[activeFile] ? loadedFiles[activeFile].name : "";
            input.dataset.fileIndex = activeFile;
            input.dataset.segmentIndex = segmentIndex;
            const btn = document.createElement("button");
            btn.className = "unit-toggle-btn";

            let currentInchValue = parseFloat(child.textContent) || 0;
            const originalPlaces = getDecimalPlaces(child.textContent);

            // Hilfsfunktionen für die Wolfram-Breite (Tungsten Width)
            const r = 0.2;
            function inchToDegree(x) {
                const ratio = x / (2 * r);
                if (ratio > 1) return 180;
                if (ratio < -1) return -180;
                return 2 * Math.asin(ratio) * (180 / Math.PI);
            }
            function degreeToInch(alpha) {
                return 2 * r * Math.sin((alpha * Math.PI) / 360);
            }

            // Setze den Standardmodus für tungsten_width auf 'degree' falls noch nicht definiert
            if (key === 'tungsten_width' && !parameterUnits[key]) {
                parameterUnits[key] = 'degree';
                saveParameterUnits();
            }

            function updateDisplay() {
                let currentMode = parameterUnits[key] || 'none';

                if (key === 'tungsten_width' && currentMode === 'degree') {
                    let degVal = inchToDegree(currentInchValue);
                    input.value = degVal.toFixed(2) + " °";
                    btn.textContent = "°";
                    btn.className = "unit-toggle-btn mode-static";
                } else if (currentMode === 'none') {
                    input.value = currentInchValue.toFixed(originalPlaces);
                    btn.textContent = "—";
                    btn.className = "unit-toggle-btn";
                } else if (currentMode === 'in') {
                    input.value = currentInchValue.toFixed(originalPlaces) + " in";
                    btn.textContent = "IN";
                    btn.className = "unit-toggle-btn mode-in";
                } else if (currentMode === 'mm') {
                    let mmVal = currentInchValue * 25.4;
                    input.value = mmVal.toFixed(2) + " mm";
                    btn.textContent = "MM";
                    btn.className = "unit-toggle-btn mode-mm";
                } else if (currentMode === 'cmmin') {
                    let cmVal = currentInchValue * 2.54;
                    input.value = cmVal.toFixed(2) + " cm/min";
                    btn.textContent = "CM/MIN";
                    btn.className = "unit-toggle-btn mode-cmmin";
                } else if (currentMode === 'ampere') {
                    input.value = currentInchValue.toFixed(originalPlaces) + " A";
                    btn.textContent = "A";
                    btn.className = "unit-toggle-btn mode-static";
                } else if (currentMode === 'volt') {
                    input.value = currentInchValue.toFixed(originalPlaces) + " V";
                    btn.textContent = "V";
                    btn.className = "unit-toggle-btn mode-static";
                } else if (currentMode === 'seconds') {
                    input.value = currentInchValue.toFixed(originalPlaces) + " s";
                    btn.textContent = "S";
                    btn.className = "unit-toggle-btn mode-static";
                } else if (currentMode === 'degree') {
                    input.value = currentInchValue.toFixed(originalPlaces) + " °";
                    btn.textContent = "°";
                    btn.className = "unit-toggle-btn mode-static";
                }
                styleInput(input);
            }

            if (key === 'tungsten_width') {
                input.dataset.originalValue = inchToDegree(parseFloat(child.textContent) || 0).toFixed(2);
            } else {
                input.dataset.originalValue = child.textContent;
            }
            input.dataset.changeKey = key + "_" + Math.random();
            input.dataset.lastLoggedValue = "";

            btn.onclick = (e) => {
                e.preventDefault();
                let currentMode = parameterUnits[key] || 'none';

                let idx = MODES_ORDER.indexOf(currentMode);
                let nextIdx = (idx + 1) % MODES_ORDER.length;
                currentMode = MODES_ORDER[nextIdx];

                parameterUnits[key] = currentMode;
                saveParameterUnits();

                document.querySelectorAll(`[data-param-name="${key}"]`).forEach(el => {
                    if (el.updateDisplay) el.updateDisplay();
                });
            };

            input.onblur = () => {
                let currentMode = parameterUnits[key] || 'none';
                let valStr = input.value.replace(/\s*(in|mm|cm\/min|A|V|s|°)$/i, "").trim();
                let parsed = parseFloat(valStr);

                if (!isNaN(parsed)) {
                    if (key === 'tungsten_width' && currentMode === 'degree') {
                        currentInchValue = degreeToInch(parsed);
                    } else if (currentMode === 'mm') {
                        currentInchValue = parsed / 25.4;
                    } else if (currentMode === 'cmmin') {
                        currentInchValue = parsed / 2.54;
                    } else {
                        currentInchValue = parsed;
                    }
                    child.textContent = currentInchValue.toFixed(originalPlaces);
                    registerChange(input, input.dataset.originalValue);
                    commitPendingEdit();
                }
                updateDisplay();
            };

            input.oninput = () => {
                let currentMode = parameterUnits[key] || 'none';
                let valStr = input.value.replace(/\s*(in|mm|cm\/min|A|V|s|°)$/i, "").trim();
                let parsed = parseFloat(valStr);
                if (!isNaN(parsed)) {
                    let calculatedInch = parsed;
                    if (key === 'tungsten_width' && currentMode === 'degree') {
                        calculatedInch = degreeToInch(parsed);
                    } else if (currentMode === 'mm') calculatedInch = parsed / 25.4;
                    else if (currentMode === 'cmmin') calculatedInch = parsed / 2.54;

                    child.textContent = calculatedInch.toFixed(originalPlaces);
                    if (selectedFiles.size && lastSelectedSection !== "segments") { applyValueToSelectedFiles(lastSelectedSection, key, child.textContent); }
                    styleInput(input);
                    registerChange(input, input.dataset.originalValue);
                }
            };

            container.setAttribute("data-param-name", key);
            container.updateDisplay = updateDisplay;

            updateDisplay();

            container.appendChild(input);
            container.appendChild(btn);
            return { container, input };
        }

        function renderPanel(title, xmlNode) {
            const content = document.getElementById("content");
            const panel = document.createElement("div"); panel.className = "panel";
            const header = document.createElement("div"); header.className = "panel-header"; header.textContent = title;
            const body = document.createElement("div"); body.className = "panel-content open";
            const table = document.createElement("table"); const tbody = document.createElement("tbody");

            const keys = [...xmlNode.children].map(c => c.tagName).sort(sortParams);

            keys.forEach(key => {
                if (hiddenFields.has(key)) return;
                const child = xmlNode.querySelector(key);
                const tr = document.createElement("tr");

                const tdName = document.createElement("td");
                tdName.textContent = key;
                tdName.style.cursor = "pointer";
                if (importantFields.has(key)) tdName.classList.add("important-name");

                tdName.ondblclick = () => { toggleImportant(key, () => showSection(title.toLowerCase())); };
                tdName.oncontextmenu = e => { e.preventDefault(); hiddenFields.add(key); saveHidden(); showSection(title.toLowerCase()); };

                const tdVal = document.createElement("td");
                const fieldObj = createInputField(child, key);

                if (importantFields.has(key)) { tdVal.classList.add("important-cell"); tr.classList.add("important-cell"); }

                tdVal.appendChild(fieldObj.container); tr.appendChild(tdName); tr.appendChild(tdVal); tbody.appendChild(tr);
            });

            table.appendChild(tbody); body.appendChild(table); panel.appendChild(header); panel.appendChild(body); content.appendChild(panel);
        }

        /* SEGMENTS */
        function renderSegmentList(file) {
            const content = document.getElementById("content");
            const list = document.createElement("div"); list.className = "panel";
            const header = document.createElement("div"); header.className = "panel-header"; header.textContent = "Segments";
            list.appendChild(header);
            const body = document.createElement("div"); body.className = "panel-content open";

            file.sections.segments.forEach((seg, i) => {
                const div = document.createElement("div"); div.className = "sidebar-item"; div.textContent = "Segment " + seg.getAttribute("index");
                div.onclick = () => renderSegment(seg); body.appendChild(div);
            });
            list.appendChild(body); content.appendChild(list);
            if (file.sections.segments.length > 0) renderSegment(file.sections.segments[0]);
        }

        function renderSegment(seg) {
            const content = document.getElementById("content");
            const old = content.querySelector(".segment-panel"); if (old) old.remove();

            const panel = document.createElement("div"); panel.className = "panel segment-panel";
            const header = document.createElement("div"); header.className = "panel-header"; header.textContent = "Segment " + seg.getAttribute("index");
            const body = document.createElement("div"); body.className = "panel-content open";
            const table = document.createElement("table"); const tbody = document.createElement("tbody");

            const keys = [...seg.children].map(c => c.tagName).sort(sortParams);

            keys.forEach(key => {
                if (hiddenFields.has(key)) return;
                const child = seg.querySelector(key);
                const tr = document.createElement("tr");

                const tdName = document.createElement("td"); tdName.textContent = key; tdName.style.cursor = "pointer";
                if (importantFields.has(key)) tdName.classList.add("important-name");

                tdName.ondblclick = () => { toggleImportant(key, () => renderSegment(seg)); };
                tdName.oncontextmenu = e => { e.preventDefault(); hiddenFields.add(key); saveHidden(); renderSegment(seg); };

                const tdVal = document.createElement("td");
                const fieldObj = createInputField(child, key);

                if (importantFields.has(key)) { tdVal.classList.add("important-cell"); tr.classList.add("important-cell"); }

                tdVal.appendChild(fieldObj.container); tr.appendChild(tdName); tr.appendChild(tdVal); tbody.appendChild(tr);
            });

            table.appendChild(tbody); body.appendChild(table); panel.appendChild(header); panel.appendChild(body); content.appendChild(panel);
        }


        function applyValueToSelectedFiles(sectionName, key, value) { selectedFiles.forEach(index => { const file = loadedFiles[index]; if (!file) return; if (sectionName === 'segments') { file.sections.segments.forEach(seg => { const node = seg.querySelector(key); if (node) node.textContent = value; }); } else { const section = file.sections[sectionName]; if (!section) return; const node = section.querySelector(key); if (node) node.textContent = value; } }); }

        /* EXPORT & SAVE */
        function triggerDownload(filename, blob) {
            const a = document.createElement('a');
            const url = URL.createObjectURL(blob);
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
        }

        function exportXmlFile(fileName, fileDoc) {
            const xml = new XMLSerializer().serializeToString(fileDoc);
            const blob = new Blob([xml], { type: "application/xml" });
            triggerDownload(fileName, blob);
            document.getElementById("status").textContent = `File saved as "${fileName}" successfully.`;
        }

        function buildBatchChangeLogText(filesToSave) {
            const savedNames = new Set(filesToSave.map(file => file.name));
            const matchingEntries = changeLog.filter(entry => savedNames.has(entry.fileName));

            if (!matchingEntries.length) {
                return [
                    "Batch Save Change Log",
                    `Saved files: ${filesToSave.length}`,
                    "No tracked file changes found for this batch.",
                    ""
                ].join("\n");
            }

            const lines = [
                "Batch Save Change Log",
                `Generated: ${new Date().toISOString()}`,
                `Saved files: ${filesToSave.length}`,
                ""
            ];

            matchingEntries.forEach(entry => {
                lines.push(
                    `[${new Date(entry.timestamp).toLocaleString()}] ${entry.fileName} | ${entry.section} | ${entry.key} | ${entry.oldValue || "-"} -> ${entry.newValue || "-"}`
                );
            });

            return lines.join("\n");
        }

        function saveSelectedFiles() {
            const filesToSave = [...selectedFiles].map(index => loadedFiles[index]).filter(Boolean);
            const targetFiles = filesToSave.length ? filesToSave : loadedFiles;

            if (!targetFiles.length) {
                document.getElementById("status").textContent = "Please select at least one file to save.";
                return;
            }

            if (window.JSZip && targetFiles.length > 1) {
                const zip = new JSZip();
                targetFiles.forEach(file => {
                    const filename = file.name.toLowerCase().endsWith(".xml") ? file.name : `${file.name}.xml`;
                    const xml = new XMLSerializer().serializeToString(file.xml);
                    zip.file(filename, xml);
                });

                const logText = buildBatchChangeLogText(targetFiles);
                zip.file("batch_change_log.txt", logText);

                zip.generateAsync({ type: "blob" }).then(blob => {
                    const zipName = `schedule_batch_export_${new Date().toISOString().replace(/[:.]/g, "-")}.zip`;
                    triggerDownload(zipName, blob);
                    document.getElementById("status").textContent = `${targetFiles.length} file(s) saved as batch archive with change log.`;
                });
                return;
            }

            targetFiles.forEach(file => {
                const filename = file.name.toLowerCase().endsWith(".xml") ? file.name : `${file.name}.xml`;
                exportXmlFile(filename, file.xml);
            });
        }

        document.getElementById("saveBtn").onclick = () => {
            if (activeFile < 0 || activeFile >= loadedFiles.length) return;
            exportXmlFile(loadedFiles[activeFile].name, loadedFiles[activeFile].xml);
        };

        document.getElementById("batchSaveBtn").onclick = () => saveSelectedFiles();

        const saveAsBtn = document.getElementById("saveAsBtn"); const saveAsModal = document.getElementById("saveAsModal");
        const customFileNameInput = document.getElementById("customFileName"); const modalCancelBtn = document.getElementById("modalCancelBtn");
        const modalConfirmBtn = document.getElementById("modalConfirmBtn");

        saveAsBtn.onclick = () => {
            const file = loadedFiles[activeFile];
            if (!file) return;
            customFileNameInput.value = file.name;
            saveAsModal.classList.add("show"); customFileNameInput.focus();
        };
        modalCancelBtn.onclick = () => { saveAsModal.classList.remove("show"); };
        modalConfirmBtn.onclick = () => {
            let name = customFileNameInput.value.trim(); if (!name) return;
            if (!name.toLowerCase().endsWith(".xml")) name += ".xml";
            if (activeFile >= 0 && loadedFiles[activeFile]) {
                exportXmlFile(name, loadedFiles[activeFile].xml);
            }
            saveAsModal.classList.remove("show");
        };

        /* COMPARE & CONVERTER TOOLS */
        function collectComparisonData(file) {
            const data = {};
            ["global", "limits", "overrides"].forEach(sectionName => {
                const section = file.sections[sectionName];
                if (!section) return;
                [...section.children].forEach(node => {
                    if (node && node.tagName) data[node.tagName] = node.textContent;
                });
            });
            const firstSegment = file.sections.segments[0];
            if (firstSegment) {
                [...firstSegment.children].forEach(node => {
                    if (node && node.tagName) data[node.tagName] = node.textContent;
                });
            }
            return data;
        }

        document.getElementById("compareBtn").onclick = () => {
            commitPendingEdit();
            document.querySelectorAll("#sidebar .sidebar-item").forEach(el => el.classList.remove("active"));
            document.getElementById("compareBtn").classList.add("active");
            const content = document.getElementById("content");
            content.innerHTML = "<h2>Schedule Comparison</h2>";

            const selectedComparisonFiles = [...selectedFiles].map(index => loadedFiles[index]).filter(Boolean);
            const filesToCompare = selectedComparisonFiles.length >= 2 ? selectedComparisonFiles : loadedFiles;

            if (filesToCompare.length < 2) {
                content.innerHTML += "<p style='color: var(--text-muted);'>Please load at least two files to compare them.</p>";
                return;
            }

            const dataMap = filesToCompare.map(file => collectComparisonData(file));
            const keys = [...new Set(dataMap.flatMap(data => Object.keys(data)))].sort(sortParams);
            const table = document.createElement("table");
            table.className = "diff-table";
            table.innerHTML = `<tr><th>Parameter</th>${filesToCompare.map(file => `<th>${file.name}</th>`).join("")}<th>Status</th></tr>`;

            keys.forEach(key => {
                if (hiddenFields.has(key)) return;
                const row = document.createElement("tr");
                const nameCell = document.createElement("td");
                nameCell.textContent = key;
                if (importantFields.has(key)) nameCell.classList.add("important-name");
                row.appendChild(nameCell);

                const values = filesToCompare.map((file, index) => String(dataMap[index][key] ?? ""));
                const unique = [...new Set(values)];
                const status = unique.length <= 1 ? "Same" : "Different";

                values.forEach(value => {
                    const valueCell = document.createElement("td");
                    valueCell.textContent = value || "-";
                    row.appendChild(valueCell);
                });

                const diffCell = document.createElement("td");
                diffCell.textContent = status;
                diffCell.className = `diff-status ${status === "Same" ? "same" : ""}`.trim();
                row.appendChild(diffCell);
                table.appendChild(row);
            });

            content.appendChild(table);
        };

        document.getElementById("converterBtn").onclick = () => {
            document.querySelectorAll("#sidebar .sidebar-item").forEach(el => el.classList.remove("active"));
            document.getElementById("converterBtn").classList.add("active");
            const content = document.getElementById("content");
            content.innerHTML = `
                <h2>Unit Converter</h2>
                <div class="panel" style="max-width: 500px;">
                    <div class="panel-header">IPM to cm/min Speed Converter</div>
                    <div class="panel-content open">
                        <div class="converter-group">
                            <div class="converter-field">
                                <label for="ipmInput">Inches Per Minute (IPM)</label>
                                <input type="number" id="ipmInput" step="any" placeholder="0.0">
                            </div>
                            <div class="converter-field"><label for="cmInput">Centimeters Per Minute (cm/min)</label><input type="number" id="cmInput" step="any" placeholder="0.0"></div>
                        </div>
                    </div>
                </div>
            `;
            const ipmInput = document.getElementById("ipmInput"); const cmInput = document.getElementById("cmInput");
            ipmInput.oninput = () => { cmInput.value = ipmInput.value === "" ? "" : (parseFloat(ipmInput.value) * 2.54).toFixed(3); };
            cmInput.oninput = () => { ipmInput.value = cmInput.value === "" ? "" : (parseFloat(cmInput.value) / 2.54).toFixed(3); };
        };

        document.getElementById("hiddenManagerBtn").onclick = () => {
            commitPendingEdit();
            document.querySelectorAll("#sidebar .sidebar-item").forEach(el => el.classList.remove("active"));
            document.getElementById("hiddenManagerBtn").classList.add("active");
            showHiddenManager();
        };

        document.getElementById("changeLogBtn").onclick = () => {
            commitPendingEdit();
            document.querySelectorAll("#sidebar .sidebar-item").forEach(el => el.classList.remove("active"));
            document.getElementById("changeLogBtn").classList.add("active");
            renderChangeLog();
        };

        function showHiddenManager() {
            const content = document.getElementById("content"); content.innerHTML = "<h2>Hidden Parameters</h2>";
            if (hiddenFields.size === 0) { content.innerHTML += "<p style='color: var(--text-muted);'>No parameters are hidden.</p>"; return; }
            const table = document.createElement("table"); table.innerHTML = "<tr><th>Parameter</th><th>Action</th></tr>";
            [...hiddenFields].sort().forEach(key => {
                const tr = document.createElement("tr"); const tdName = document.createElement("td"); tdName.textContent = key;
                const tdAction = document.createElement("td"); const btn = document.createElement("button"); btn.textContent = "Restore"; btn.className = "btn-primary"; btn.style.padding = "4px 12px"; btn.style.fontSize = "12px";
                btn.onclick = () => { hiddenFields.delete(key); saveHidden(); showHiddenManager(); };
                tdAction.appendChild(btn); tr.appendChild(tdName); tr.appendChild(tdAction); table.appendChild(tr);
            });
            content.appendChild(table);
        }

        /* CHANGES & SEARCH */
        let changeCount = 0; const changeMap = new Map();
        function updateChangeCounter() { changeCount = changeLog.length; document.getElementById("changeCounter").textContent = changeCount + " Changes"; }

        function registerChange(input, original) {
            const key = input.dataset.fieldName || input.dataset.changeKey;
            const cleanVal = input.value.replace(/\s*(in|mm|cm\/min|A|V|s|°)$/i, "").trim();
            const currentNum = parseFloat(cleanVal);
            const originalNum = parseFloat(original);
            const changed = currentNum !== originalNum;
            const fileIndex = parseInt(input.dataset.fileIndex, 10);
            const sectionName = input.dataset.sectionName || lastSelectedSection || "unknown";
            const segmentIndex = input.dataset.segmentIndex || "";
            const fileName = input.dataset.fileName || (loadedFiles[fileIndex] ? loadedFiles[fileIndex].name : "unknown");

            updateChangeLogEntry({
                fileIndex,
                fileName,
                sectionName,
                key,
                segmentIndex,
                oldValue: original || "",
                newValue: cleanVal
            });

            if (!pendingEdit) {
                pendingEdit = { changes: [] };
            }
            const existingChange = pendingEdit.changes.find(c => c.fileIndex === fileIndex && c.sectionName === sectionName && c.key === key && (c.segmentIndex || "") === (segmentIndex || ""));
            if (existingChange) {
                existingChange.newValue = cleanVal;
            } else {
                pendingEdit.changes.push({ fileIndex, fileName, sectionName, key, segmentIndex, oldValue: original || "", newValue: cleanVal });
            }

            input.classList.toggle("changed", changed);
            updateChangeCounter();
        }

        document.getElementById("searchBox").oninput = (e) => {
            const term = e.target.value.toLowerCase();
            document.querySelectorAll("table tr").forEach(tr => {
                if (tr.parentElement.tagName !== "THEAD" && tr.firstElementChild.tagName !== "TH") {
                    tr.style.display = tr.innerText.toLowerCase().includes(term) ? "" : "none";
                }
            });
        };

        window.addEventListener("beforeunload", e => { if (changeCount > 0) { e.preventDefault(); e.returnValue = ""; } });

        /* ORIGINAL RESTORE INTEGRATION */
        document.getElementById('selectAllBtn').onclick = () => { selectedFiles.clear(); loadedFiles.forEach((f, i) => selectedFiles.add(i)); renderFileList(); updateSelectionStatus(); };
        document.getElementById('clearSelectionBtn').onclick = () => { selectedFiles.clear(); renderFileList(); updateSelectionStatus(); };
        document.getElementById('returnBtn').onclick = () => undoLastEdit();
        document.getElementById('redoBtn').onclick = () => redoLastEdit();

        document.getElementById('returnBtn').title = 'Undo last change';
        document.getElementById('redoBtn').title = 'Redo last undone change';
        document.getElementById('batchSaveBtn').title = 'Save selected XML files as a ZIP archive with change log';

        document.getElementById('batchSaveBtn').disabled = loadedFiles.length === 0;

        function restoreOriginalValues() {
            loadedFiles = loadedFiles.map(file => {
                const xml = file.originalXml.cloneNode(true);
                return {
                    name: file.name,
                    xml,
                    originalXml: file.originalXml,
                    sections: {
                        global: xml.querySelector("global"),
                        limits: xml.querySelector("limits"),
                        overrides: xml.querySelector("overrides"),
                        segments: [...xml.querySelectorAll("segment")]
                    }
                };
            });
            undoStack = [];
            redoStack = [];
            pendingEdit = null;
            changeLog = [];
            saveChangeLog();
            updateChangeCounter();
            updateUndoRedoButtons();
            if (loadedFiles.length && activeFile >= 0 && activeFile < loadedFiles.length) {
                showSection(lastSelectedSection);
            }
            document.getElementById('status').textContent = 'Original values restored.';
        }

        window.addEventListener('DOMContentLoaded', () => {
            const resetBtn = document.createElement('button');
            resetBtn.id = 'resetChangesBtn';
            resetBtn.textContent = 'Restore Original Values';
            resetBtn.style.marginLeft = '8px';
            resetBtn.disabled = true;
            const saveAsBtnEl = document.getElementById('saveAsBtn');
            if (saveAsBtnEl) saveAsBtnEl.parentNode.insertBefore(resetBtn, saveAsBtnEl.nextSibling);

            resetBtn.addEventListener('click', () => {
                restoreOriginalValues();
            });
        });
    </script>
</body>

</html>
