<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Liburdi Schedule Suite</title>
    <style>
        :root { color-scheme: dark; --bg: #141416; --panel: #202024; --border: #2d2d34; --text: #f3f3f5; --muted: #96969d; --accent: #ff9800; }
        * { box-sizing: border-box; }
        body { min-height: 100vh; margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        #launcher { display: grid; min-height: 100vh; padding: 32px 20px; place-items: center; }
        .launcher-content { width: min(760px, 100%); }
        h1 { margin: 0; font-size: clamp(28px, 5vw, 40px); }
        .intro { margin: 12px 0 30px; color: var(--muted); line-height: 1.6; }
        .apps { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 16px; }
        .app-card { display: flex; min-height: 190px; flex-direction: column; padding: 22px; border: 1px solid var(--border); border-radius: 10px; background: var(--panel); color: inherit; text-decoration: none; cursor: pointer; transition: border-color .15s, transform .15s; }
        .app-card:hover, .app-card:focus-visible { transform: translateY(-2px); border-color: var(--accent); outline: none; }
        .app-card h2 { margin: 0 0 10px; font-size: 19px; }
        .app-card p { margin: 0; color: var(--muted); line-height: 1.55; }
        .open-app { margin-top: auto; padding-top: 22px; color: var(--accent); font-weight: 650; }
        #app-view { display: none; width: 100%; height: 100vh; }
        #app-frame { display: block; width: 100%; height: 100%; border: 0; }
    </style>
</head>
<body>
    <main id="launcher">
        <div class="launcher-content">
            <h1>Liburdi Schedule Suite</h1>
            <p class="intro">Wählen Sie die Anwendung, die Sie öffnen möchten.</p>
            <nav class="apps" aria-label="Anwendungen">
                <a class="app-card" href="#editor" data-app="editor">
                    <h2>Schedule Editor</h2>
                    <p>Liburdi-Schedule-XML-Dateien bearbeiten, vergleichen und speichern.</p>
                    <span class="open-app">Editor öffnen &rarr;</span>
                </a>
                <a class="app-card" href="#database" data-app="database">
                    <h2>Schedule Database</h2>
                    <p>Programme und XDR-Schemas lokal verwalten und bearbeitete Programme abrufen.</p>
                    <span class="open-app">Datenbank öffnen &rarr;</span>
                </a>
            </nav>
        </div>
    </main>
    <div id="app-view"><iframe id="app-frame" title="Schedule Anwendung"></iframe></div>

    <script>
        const launcher = document.getElementById('launcher');
        const appView = document.getElementById('app-view');
        const appFrame = document.getElementById('app-frame');
        const pages = {
            editor: document.getElementById('editor-page-data').textContent.trim(),
            database: document.getElementById('database-page-data').textContent.trim()
        };
        let activePageUrl = null;

        function decodePage(encoded) {
            const binary = atob(encoded);
            const bytes = Uint8Array.from(binary, character => character.charCodeAt(0));
            return new TextDecoder().decode(bytes);
        }

        function showPage(route) {
            if (activePageUrl) {
                URL.revokeObjectURL(activePageUrl);
                activePageUrl = null;
            }

            const html = decodePage(pages[route]);
            const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
            activePageUrl = URL.createObjectURL(blob);
            appFrame.src = activePageUrl;
            appFrame.title = route === 'editor' ? 'Schedule Editor' : 'Schedule Database';
        }

        function showRoute() {
            const route = location.hash.slice(1);
            if (route === 'editor' || route === 'database') {
                launcher.style.display = 'none';
                appView.style.display = 'block';
                showPage(route);
                return;
            }
            appFrame.removeAttribute('src');
            if (activePageUrl) {
                URL.revokeObjectURL(activePageUrl);
                activePageUrl = null;
            }
            appView.style.display = 'none';
            launcher.style.display = 'grid';
        }

        window.addEventListener('hashchange', showRoute);
        showRoute();
    </script>
